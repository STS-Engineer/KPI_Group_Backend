name: Deploy combined KPI application
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-kpi-codir
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: STS-Engineer/KPI_Group_Frontend
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        env:
          VITE_API_URL: '/'
      - name: Test backend
        working-directory: backend
        env:
          DISABLE_CRON_JOBS: 'true'
        run: |
          npm ci
          npm test
      - name: Assemble
        run: |
          mkdir -p backend/frontend-dist
          cp -a frontend/dist/. backend/frontend-dist/
          test -f backend/frontend-dist/index.html
          rm -rf backend/.git
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: kpi-codir
          package: backend
          startup-command: npm start
